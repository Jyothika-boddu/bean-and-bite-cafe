<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Now</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

   <div class="order-card">

       <h1>Place Your Order</h1>

       <p>Thank you for choosing us! ❤️</p>

       <label>Enter your name:</label>
       <input type="text" id="name" placeholder="Your Name">

       <label>Choose your order:</label>

       <select id="food" onchange="updateTotal()">
           <option value="">-- Select a food item --</option>
           <option value="Cappuccino">Cappuccino - ₹120</option>
           <option value="Chocolate Cake">Chocolate Cake - ₹150</option>
           <option value="Grilled Sandwich">Grilled Sandwich - ₹100</option>
       </select>

       <label>Quantity:</label>

       <div class="quantity-box">
           <button type="button" onclick="decreaseQuantity()">−</button>
           <span id="quantity">1</span>
           <button type="button" onclick="increaseQuantity()">+</button>
       </div>
       <p class="total-price">
           Total: ₹<span id="total">0</span>
       </p>
       <div class="order-summary">
           <h2>Order Summary</h2>

           <p>Food: <span id="summaryFood">Not selected</span></p>
           <p>Quantity: <span id="summaryQuantity">0</span></p>
           <p>Total: ₹<span id="summaryTotal">0</span></p>
       </div>
       <button onclick="placeOrder()">Place Order</button>
       <p id="successMessage"></p>

    </div>
<script>
    let quantity = 1;
    let prices = {
        "Cappuccino": 120,
        "Chocolate Cake": 150,
        "Grilled Sandwich": 100
    };
    function updateTotal() {
        let food = document.getElementById("food").value;
        let total = 0;

        if (food !== "") {
            total = prices[food] * quantity;
        }

        document.getElementById("total").textContent = total;

        document.getElementById("summaryFood").textContent =
        food !== "" ? food : "Not selected";

        document.getElementById("summaryQuantity").textContent = quantity;

         document.getElementById("summaryTotal").textContent = total;
    }
    function increaseQuantity() {
        quantity = quantity + 1;
        document.getElementById("quantity").textContent = quantity;
         updateTotal();
    }
    function decreaseQuantity() {
        if (quantity > 1) {
            quantity = quantity - 1;

            document.getElementById("quantity").textContent = quantity;

            updateTotal();
        }
    }
    function placeOrder() {
        let name = document.getElementById("name").value;
        let food = document.getElementById("food").value;
        let total = document.getElementById("total").textContent;
        let successMessage = document.getElementById("successMessage");

        if (name === "" || food === "") {
            successMessage.textContent = "Please enter your name and food item.";
            successMessage.style.color = "red";
        } else {
            successMessage.innerHTML =
                "🎉 Thank you, " + name + "!<br>" +
                "Your " + food + " order has been placed successfully!<br>" +
                "Quantity: " + quantity + " | Total: ₹" + total;
            successMessage.style.color = "green";
       }
    }
</script>
</body>
</html>
